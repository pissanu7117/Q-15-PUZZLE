<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><title>15 PUZZLE</title><style>
:root{--tile:#3977c9;--number:#ffffff;--size:76%;--accent:#b57c36}*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:620px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;justify-content:center;gap:12px}h1{text-align:center;font-size:clamp(27px,7vw,42px);margin:0}.sub{text-align:center;color:#a8bedd;letter-spacing:2px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#202d42;padding:9px;border-radius:13px;text-align:center}.stat span{display:block;color:#a8bedd;font-size:13px}.stat strong{font-size:25px;font-variant-numeric:tabular-nums}.board{background:#28364b;padding:5px;border-radius:13px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;width:100%;aspect-ratio:1}.tile{border:0;border-radius:8px;background:var(--tile);color:var(--number);font-weight:900;min-width:0;display:grid;place-items:center;touch-action:manipulation;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}.tile .digit{font-size:var(--size);line-height:1;white-space:nowrap}.tile.orange{background:var(--accent)}.tile.blank{background:#152238;cursor:default}.tile:active:not(.blank){filter:brightness(1.2);transform:scale(.97)}.controls{background:#202d42;border-radius:13px;padding:12px;display:grid;gap:10px}.controls label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:#e0eafa}.controls select{background:#101827;color:white;border:1px solid #667b99;border-radius:8px;padding:9px;max-width:60%;font-size:15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}button.action{border:0;border-radius:12px;background:#3977c9;color:white;font-size:16px;font-weight:750;padding:14px 8px;cursor:pointer}.action.secondary{background:#344965}.hint{text-align:center;color:#a8bedd;margin:0;font-size:13px}.win{text-align:center;color:#f6c56b;font-size:19px;font-weight:800;min-height:24px}@media(max-height:740px){main{justify-content:flex-start}}@media(min-width:620px){main{max-width:530px}}
</style></head><body><main><h1>15 PUZZLE</h1><div class="sub">CLASSIC BLUE • 4 × 4</div><div class="stats"><div class="stat"><span>จำนวนครั้งที่เลื่อน</span><strong id="moves">0</strong></div><div class="stat"><span>เวลา</span><strong id="time">00:00</strong></div></div><div class="board" id="board" aria-label="เกมเลื่อนตัวเลข 4 คูณ 4"></div><div class="win" id="win" aria-live="polite"></div><section class="controls" aria-label="ปรับแต่งเกม"><label>ขนาดตัวเลข<select id="size"><option value="54">ปกติ</option><option value="65">ใหญ่</option><option value="76" selected>ใหญ่มาก</option><option value="88">ใหญ่พิเศษ</option></select></label><label>สีช่องสี่เหลี่ยม<select id="tileColor"><option value="blue">ฟ้าน้ำเงิน</option><option value="cyan">ฟ้าสดใส</option><option value="green">เขียว</option><option value="purple">ม่วง</option><option value="red">แดง</option><option value="orange">ส้ม</option><option value="pink">ชมพู</option></select></label><label>สีตัวเลข<select id="numberColor"><option value="white">ขาว</option><option value="yellow">เหลือง</option><option value="black">ดำ</option><option value="navy">น้ำเงินเข้ม</option><option value="cyan">ฟ้าอ่อน</option><option value="pink">ชมพูอ่อน</option></select></label></section><div class="actions"><button class="action" id="restart">↻ สุ่มเกมใหม่</button><button class="action secondary" id="resetColors">คืนค่าสีเดิม</button></div><p class="hint">แตะเลขที่ติดกับช่องว่างเพื่อเลื่อน • เลข 15 สีส้มตามแบบเดิม</p></main><script>
'use strict';const solved=Array.from({length:16},(_,i)=>(i+1)%16);let tiles=[],moves=0,seconds=0,running=false,won=false,timer=null;const board=document.getElementById('board'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),winEl=document.getElementById('win');function clock(){timeEl.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function draw(){board.replaceChildren();tiles.forEach((n,i)=>{const b=document.createElement('button');b.className='tile'+(n===0?' blank':n===15?' orange':'');b.setAttribute('aria-label',n?'เลข '+n:'ช่องว่าง');if(n){const span=document.createElement('span');span.className='digit';span.textContent=n;b.append(span)}b.onclick=()=>move(i);board.append(b)});movesEl.textContent=moves;clock()}function move(i){if(won)return;const z=tiles.indexOf(0);if(Math.abs(Math.floor(i/4)-Math.floor(z/4))+Math.abs(i%4-z%4)!==1)return;if(!running){running=true;timer=setInterval(()=>{seconds++;clock()},1000)}[tiles[i],tiles[z]]=[tiles[z],tiles[i]];moves++;if(tiles.every((n,j)=>n===solved[j])){won=true;clearInterval(timer);winEl.textContent='🏆 สำเร็จแล้ว! '+moves+' ครั้ง เวลา '+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}draw()}function restart(){clearInterval(timer);tiles=[...solved];let z=15,previous=-1;for(let k=0;k<180;k++){const choices=[z%4?z-1:-1,z%4<3?z+1:-1,z>=4?z-4:-1,z<12?z+4:-1].filter(x=>x>=0&&x!==previous);const q=choices[Math.floor(Math.random()*choices.length)];[tiles[z],tiles[q]]=[tiles[q],tiles[z]];previous=z;z=q}moves=0;seconds=0;running=false;won=false;winEl.textContent='';draw()}
const palettes={tileColor:{blue:'#3977c9',cyan:'#20a5d8',green:'#238d70',purple:'#7653bb',red:'#c94d5d',orange:'#c47c32',pink:'#c85c96'},numberColor:{white:'#ffffff',yellow:'#ffe36a',black:'#111827',navy:'#102d53',cyan:'#b5f3ff',pink:'#ffd1e8'}};const size=document.getElementById('size'),tileColor=document.getElementById('tileColor'),numberColor=document.getElementById('numberColor');function loadChoice(el,defaultValue){let v;try{v=localStorage.getItem('15p-'+el.id)}catch(e){}el.value=[...el.options].some(o=>o.value===v)?v:defaultValue}function apply(){document.documentElement.style.setProperty('--size',size.value+'%');document.documentElement.style.setProperty('--tile',palettes.tileColor[tileColor.value]);document.documentElement.style.setProperty('--number',palettes.numberColor[numberColor.value]);for(const el of [size,tileColor,numberColor]){try{localStorage.setItem('15p-'+el.id,el.value)}catch(e){}}}loadChoice(size,'76');loadChoice(tileColor,'blue');loadChoice(numberColor,'white');for(const el of [size,tileColor,numberColor])el.addEventListener('change',apply);document.getElementById('resetColors').onclick=()=>{size.value='76';tileColor.value='blue';numberColor.value='white';apply()};document.getElementById('restart').onclick=restart;apply();restart();
</script></body></html>
